name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests, Lambda handler tests, booking race test
        run: mvn -B verify
